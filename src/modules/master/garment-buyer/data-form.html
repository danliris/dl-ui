<template>

  <div class="row">
    <div class="col-md-6">
      <au-input-form title.bind="title" with.bind="context" options.bind="formOptions">

        <au-textbox label="Kode" value.bind="data.Code" error.bind="error.Code"
          read-only.bind="(readOnly || isEdit)"></au-textbox>

        <au-textbox label="Nama" value.bind="data.Name" error.bind="error.Name" read-only.bind="(readOnly || isEdit)"></au-textbox>

        <au-multiline label="Alamat" value.bind="data.Address" error.bind="error.Address"
          read-only.bind="readOnly"></au-multiline>

        <au-textbox label="Kota" value.bind="data.City" error.bind="error.City" read-only.bind="readOnly"></au-textbox>

        <!-- <au-dropdown label="Negara" value.bind="data.Country" error.bind="error.Country" read-only.bind="readOnly"
          items.bind="countries"></au-dropdown> -->

        <au-autocomplete label="Negara" value.bind="country" error.bind="error.Country"
          read-only.bind="readOnly" loader.bind="countryLoader" text.bind="countryLoaderView" placeholder="Cari Negara">
        </au-autocomplete>

        <au-textbox label="Kontak" value.bind="data.Contact" error.bind="error.Contact"
          read-only.bind="readOnly"></au-textbox>

        <au-autocomplete label="Term of Payment" value.bind="top" error.bind="error.TermOfPaymentD365"
          read-only.bind="readOnly" loader.bind="topLoader" text.bind="topLoaderView" placeholder="Cari Term of Payment">
        </au-autocomplete>

        <au-numeric label="Tempo" value.bind="data.Tempo" error.bind="error.Tempo" format="0"
          read-only.bind="true"></au-numeric>

        <au-autocomplete label="Mata Uang" value.bind="currency" error.bind="error.Currency"
          loader.one-time="currencyLoader" text="Code" read-only.bind="readOnly" placeholder="Cari Mata Uang">
        </au-autocomplete>

        <au-autocomplete label="Bank Detail" value.bind="bankAccount" error.bind="error.BankAccount"
          read-only.bind="readOnly" loader.bind="accountBankLoader" text.bind="accountBankView" placeholder="Cari Bank">
        </au-autocomplete>

        <au-textbox label="No Rekening" value.bind="data.BankAccount.AccountNumber" read-only.bind="true"></au-textbox>

        <au-textbox label="NPWP" value.bind="data.NPWP" error.bind="error.NPWP" read-only.bind="readOnly"></au-textbox>

        <au-dropdown label="Jenis Buyer" value.bind="data.Type" error.bind="error.Type" read-only.bind="(readOnly || isEdit)"
          items.bind="types"></au-dropdown>

        <template replaceable part="actions"></template>
      </au-input-form>
    </div>
  </div>

</template>
