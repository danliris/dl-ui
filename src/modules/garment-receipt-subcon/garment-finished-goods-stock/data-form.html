<template>
  <au-input-form title.bind="title" with.bind="context" options.bind="formOptions">
    <div slot="actions" class="btn-group">
      <button class="btn btn-default"
        click.delegate="context.cancel($event)"
        if.one-way="context.hasCancel">
        Kembali
      </button>

      <button class="btn btn-success"
        click.delegate="context.save($event)"
        if.one-way="context.hasSave">
        Simpan
      </button>
    </div>

    <div class="row">
      <au-textbox
        label="Nomor RO"
        value.bind="data.RONo"
        error.bind="error.RONo"
        read-only.bind="true"
        options.bind="controlOptions">
      </au-textbox>

      <au-textbox
        label="Unit"
        value.bind="data.UnitName"
        error.bind="error.UnitName"
        read-only.bind="true"
        options.bind="controlOptions">
      </au-textbox>

      <au-textbox
        label="Komoditi"
        value.bind="data.ComodityName"
        error.bind="error.ComodityName"
        read-only.bind="true"
        options.bind="controlOptions">
      </au-textbox>

      <au-textbox
        label="Artikel"
        value.bind="data.Article"
        error.bind="error.Article"
        read-only.bind="true"
        options.bind="controlOptions">
      </au-textbox>

      <au-numeric
        label="Quantity"
        value.bind="data.Quantity"
        error.bind="error.Quantity"
        read-only.bind="true"
        options.bind="controlOptions">
      </au-numeric>

      <au-textbox
        label="Satuan"
        value.bind="data.UomUnit"
        error.bind="error.UomUnit"
        read-only.bind="true"
        options.bind="controlOptions">
      </au-textbox>
    </div>

    <!-- <div class="row" style="margin-top: 15px;">
      <div class="col-md-4" style="padding-left: 0; font-weight: bold;">
        <au-numeric
          label="Total Split Quantity"
          value.one-way="totalSplitQuantity"
          read-only.bind="true"
          options.bind="controlOptions">
        </au-numeric>
      </div>
    </div> -->

    <au-collection
      if.bind="isItems"
      items.bind="data.Items"
      errors.bind="error.Items"
      columns.bind="items.columns"
      options.bind="itemOptions"
      read-only.bind="readOnly"
      header-template="modules/garment-production/garment-finished-goods-stock/template/item-header"
      item-template="modules/garment-production/garment-finished-goods-stock/template/item">
    </au-collection>
  </au-input-form>

  <div class="row"></div>
</template>
