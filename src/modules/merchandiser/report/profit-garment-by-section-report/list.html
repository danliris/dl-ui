<template>
    <require from="../../../../au-components/form/input/_input"></require>
    <require from="../../../../lib/number-format-value-converter"></require>
    <h1 class="page-header">Display Profit Garment Per Seksi</h1>
    <form class="form-horizontal">
          <au-autocomplete 
            label="Seksi"
            value.bind="section"
            error.bind="error.Section"
            loader.bind="sectionLoader"
            text.bind = "sectionView"
            key="SectionCode"
            aria-placeholder="Cari Seksi"
            options.bind="controlOptions">
        </au-autocomplete>
        <au-datepicker label="Tanggal Shipment Awal" value.bind="dateFrom"></au-datepicker>
        <au-datepicker label="Tanggal Shipment Akhir" value.bind="dateTo"></au-datepicker>
        <div class="form-group">
            <label for="contact" class="col-sm-6 control-label"></label>
            <div class="col-sm-3">
                <button click.delegate="searching()" class='btn btn-success'>Cari Data</button>
                <button click.delegate="reset()" class='btn btn-danger'>Reset Data</button>
            </div>
        </div>
        <div slot="toolbar" class="btn-group">
            <button class='btn btn-primary' click.delegate="ExportToExcel()">Export To Excel</button>
        </div>
        <div slot="toolbar" class="btn-group">
            <button class='btn btn-primary' click.delegate="ExportToExcelNew()">Export To Excel New</button>
        </div>
        <br>
        <div if.bind="old && old.length > 0" class="table-responsive">
             <table class="table table-bordered table-hover" id="myTable">
            <thead>
                <tr>
                        <th class="text-center" colspan="34">
                            <button
                                type="button"
                                class="btn btn-default btn-xs pull-left"
                                style="width: 60px; min-width: 60px; text-align: center;"
                                click.delegate="toggleCostCalculationOld()">
                                ${hideCostCalculationOld ? 'Show' : 'Hide'}
                            </button>
                            COST CALCULATION OLD

                        </th>
                    </tr>
                <tr>
                    <th class="text-center">Nomor</th>
                    <th class="text-center">Nomor RO</th>
                    <th class="text-center">Section</th>
                    <th class="text-center">Unit Name</th>
                    <th class="text-center">Agent Code</th>
                    <th class="text-center">Buyer Agent Name</th>
                    <th class="text-center">Brand Code</th>
                    <th class="text-center">Buyer Brand Name</th>
                    <th class="text-center">Article / Style</th>
                    <th class="text-center">Product Category</th>
                    <th class="text-center">Product</th>
                    <th class="text-center">Fabric Allowance %</th>      
                    <th class="text-center">Acc Allowance %</th> 
                    <th class="text-center">Shipment Date</th>
                    <th class="text-center">UoM</th>      
                    <th class="text-center">Order Quantity</th>
                            
                    <th class="text-center">Confirm Price</th>
                    <th class="text-center">Rate USD</th>
                    <th class="text-center">Fabric Cost</th>
                    <th class="text-center">FOB Price</th>     
                    <th class="text-center">Amount</th\>     
                    <th class="text-center">Commission %</th>                                                                     
                    <th class="text-center">Profit %</th>
                    <th class="text-center">Profit IDR</th>                    
                    <th class="text-center">Profit USD</th>
                    <th class="text-center">Profit/FOB %</th>
                    <th class="text-center">Gross Profit</th>    
                    <th class="text-center">Premi</th>
                    <th class="text-center">Total</th>
                    <th class="text-center">OTL 1</th>
                    <th class="text-center">OTL 2</th>
                    <th class="text-center">Risk (%)</th>
                    <th class="text-center">Biaya Angkut</th>
                    <th class="text-center">Subtotal</th>

                </tr>
            </thead>
            <tbody>
                <template repeat.for="Seksi of Sections">
                    <tr repeat.for="item of Seksi.data" show.bind="!hideCostCalculationOld">
                        <td class="text-center"> ${$index + 1}</td>
                        <td>${item.RO_Number}</td>
                        <td>${item.Section}</td>
                        <td>${item.UnitName}</td>
                        <td>${item.BuyerCode}</td>
                        <td>${item.BuyerName}</td>
                        <td>${item.BrandCode}</td>
                        <td>${item.BrandName}</td>
                        <td>${item.Article}</td>
                        <td>${item.ProductCategory}</td>
                        <td>${item.Comodity}</td>
                        <td class="text-right">${item.FabAllow}</td>
                        <td class="text-right">${item.AccAllow}</td>
                        <td>${item.DeliveryDate}</td>
                        <td>${item.UOMUnit}</td>
                        <td class="text-right">${item.Quantity}</td>
                        <td class="text-right">${item.ConfirmPrice}</strong></td>     
                        <td class="text-right">${item.CurrencyRate}</strong></td>                             
                        <td class="text-right">${item.CMPrice}</strong></td>   
                        <td class="text-right">${item.FOBPrice}</strong></td>                             
                        <td class="text-right">${item.Amount}</td>   
                        <td class="text-right">${item.Commision}</td>
                        <td class="text-right">${item.Profit}</td>
                        <td class="text-right">${item.ProfitIDR}</td>                        
                        <td class="text-right">${item.ProfitUSD}</td>      
                        <td class="text-right">${item.ProfitFOB}</td>
                        <td class="text-right">${item.GrossProfit}</td>
                        <td class="text-right">${item.Premi}</td>
                        <td class="text-right">${item.Total}</td>
                        <td class="text-right">${item.OTL1}</td>
                        <td class="text-right">${item.OTL2}</td>
                        <td class="text-right">${item.PersenRisk}</td>
                        <td class="text-right">${item.FreightCost}</td>
                        <td class="text-right">${item.SubTotal}</td>
                    </tr>
                    <tr class="active">
                        <td class="text-center"></td>    
                        <td colspan="8"><strong>S E K S I : ${Seksi.SECTION}</strong></td>
                        <td class="text-center" colspan="5"><strong>SUB TOTAL</strong></td>
                        <td class="text-center"></td>
                        <td class="text-center"></td>
                        <td class="text-center" colspan="4"><strong></strong></td>    
                        <td class="text-right"><strong>${Seksi.subTotalAmount}</strong></td>     
                        <td class="text-center" colspan="2"><strong></strong></td>                                             
                        <td class="text-right"><strong>${Seksi.subTotalProfitIDR}</strong></td>     
                        <td class="text-right"><strong>${Seksi.subTotalProfitUSD}</strong></td>     
                        <td class="text-center"><strong></strong></td>
                        <td class="text-center"><strong>${Seksi.subTotalGrossProfit}</strong></td> 
                        <td class="text-center"><strong>${Seksi.subTotalPremi}</strong></td>  
                        <td class="text-center" colspan="6"><strong></strong></td>                                       
                    </tr>
                </template>
                <tr class="active" repeat.for="item of grandTotalByUom">
                        <td class="text-center"  style="background-color: #173250; color: #ffffff;" colspan="14" 
                            rowspan.bind="grandTotalByUom.length"if.bind="$index == 0">
                            <strong>T O T A L :</strong>
                        </td>
                        <td class="text-center"><strong>${item.uom}</strong></td>
                        <td class="text-right"><strong>${item.quantity | numberFormat:'0,000.00'}</strong></td>
                        <td class="text-center" colspan="4"><strong></strong></td>
                        <td class="text-right"><strong>${item.amount | numberFormat:'0,000.00'}</strong></td>
                        <td class="text-center" colspan="2"><strong></strong></td>
                        <td class="text-right"><strong>${item.profitIDR | numberFormat:'0,000.00'}</strong></td>
                        <td class="text-right"><strong>${item.profitUSD | numberFormat:'0,000.00'}</strong></td>
                        <td class="text-center"><strong></strong></td>
                        <td class="text-right"><strong>${item.grossProfit | numberFormat:'0,000.00'}</strong></td>
                        <td class="text-right"><strong>${item.premi | numberFormat:'0,000.00'}</strong></td>
                        <td class="text-center" colspan="6"><strong></strong></td>   
                    </tr>
                </tbody>
                </table>
                    </div>
        <br>
        <div if.bind="new && new.length > 0" class="table-responsive">
            <table class="table table-bordered table-hover" id="myTable">
                <thead>
                    <tr>
                        <th class="text-center" colspan="39">
                            <button
                                type="button"
                                class="btn btn-default btn-xs pull-left"
                                style="width: 60px; min-width: 60px; text-align: center;"
                                click.delegate="toggleCostCalculationNew()">
                                ${hideCostCalculationNew ? 'Show' : 'Hide'}
                            </button>
                            COST CALCULATION NEW
                        </th>
                    </tr>
                    <tr>
                        <th class="text-center">No.</th>
                        <th class="text-center">RO Number</th>
                        <th class="text-center">Section</th>
                        <th class="text-center">Unit Name</th>
                        <th class="text-center">Agent Code</th>
                        <th class="text-center">Buyer Agent Name</th>
                        <th class="text-center">Brand Code</th>
                        <th class="text-center">Buyer Brand Name</th>
                        <th class="text-center">Article / Style</th>
                        <th class="text-center">Commodity</th>
                        <th class="text-center">Description</th>

                        <th class="text-center">Shipment Date</th>
                        <th class="text-center">UoM</th>
                        <th class="text-center">Order Quantity</th>
                        <th class="text-center">SMV Cutting</th>
                        <th class="text-center">SMV Sewing</th>
                        <th class="text-center">SMV Finishing</th>
                        <th class="text-center">SMV Total</th>
                        <th class="text-center">Confirm Price</th>
                        <th class="text-center">Fabric Cost</th>
                        <th class="text-center">FOB Price</th>
                        <th class="text-center">Amount</th>
                        <th class="text-center">Rate USD</th>
                        <th class="text-center">Amount IDR</th>
                        <th class="text-center">Commission %</th>
                        <th class="text-center">Total Material Cost</th>
                        <th class="text-center">Total Process Cost</th>
                        <th class="text-center">Total Ongkir</th>
                        <th class="text-center">Est Product Cost</th>
                        <th class="text-center">Gross Profit IDR</th>
                        <th class="text-center">Gross Profit %</th>
                        <th class="text-center">GP Premi IDR</th>
                        <th class="text-center">GP Premi %</th>
                        <th class="text-center">Beban Penjualan</th>
                        <th class="text-center">Beban Umum & Administrasi</th>
                        <th class="text-center">Beban Diluar Usaha</th>
                        <th class="text-center">Total BOM</th>
                        <th class="text-center">Net Profit IDR</th>
                        <th class="text-center">Net Profit %</th>
                    </tr>
                </thead>
                
                <tbody >
                    <template repeat.for="Seksi of SectionsNew">
                        <tr repeat.for="item of Seksi.data" show.bind="!hideCostCalculationNew">
                            <td>${$index + 1}</td>
                            <td>${item.RO_Number}</td>
                            <td>${item.Section}</td>
                            <td>${item.UnitName}</td>
                            <td>${item.BuyerCode}</td>
                            <td>${item.BuyerName}</td>
                            <td>${item.BrandCode}</td>
                            <td>${item.BrandName}</td>
                            <td>${item.Article}</td>
                            <td>${item.Comodity}</td>
                            <td>${item.ComodityDescription}</td>
                            <td>${item.Shipment}</td>
                            <td>${item.UOMUnit}</td>
                            <td class="text-right">${item.QuantityOrder}</td>
                            <td>${item.SMVCutting}</td>
                            <td>${item.SMVSewing}</td>
                            <td>${item.SMVFinishing}</td>
                            <td>${item.SMVTotal}</td>
                            <td>${item.ConfirmPrice}</td>
                            <td>${item.FabricCost}</td>
                            <td>${item.FOBPrice}</td>
                            <td class="text-right">${item.Amount}</td>
                            <td>${item.RateUSD}</td>
                            <td class="text-right">${item.AmountIDR}</td>
                            <td>${item.Komisi}</td>
                            <td>${item.TotalMaterialCost}</td>
                            <td>${item.TotalProcessCost}</td>
                            <td>${item.TotalOngkir}</td>
                            <td>${item.EstProductCost}</td>
                            <td>${item.GrossProfitIDR}</td>
                            <td>${item.GrossProfitPercent}</td>
                            <td>${item.GPPremiIDR}</td>
                            <td>${item.GPPremiPercent}</td>
                            <td>${item.SellingExpense}</td>
                            <td>${item.GeneralAdminExpense}</td>
                            <td>${item.NonOperatingExpense}</td>
                            <td>${item.TotalBOM}</td>
                            <td>${item.NetProfitIDR}</td>
                            <td>${item.NetProfitPercent}</td>
                        </tr>

                        <tr class="active">
                            <td></td>
                            <td colspan="7">
                                <strong>SEKSI: ${Seksi.SECTION}</strong>
                            </td>
                            <td colspan="4" class="text-center"><strong>SUB TOTAL</strong></td>
                            <td></td>
                            <td class="text-right"></strong></td>
                            <td colspan="7"></td>
                            <td class="text-right"><strong>${Seksi.subTotalAmount}</strong></td>
                            <td></td>
                            <td class="text-right"><strong>${Seksi.subTotalAmountIDR}</strong></td>
                            <td colspan="5"></td>
                            <td class="text-right"><strong>${Seksi.subTotalGrossProfitIDR}</strong></td>
                            <td></td>
                            <td class="text-right"><strong>${Seksi.subTotalGPPremiIDR}</strong></td>
                            <td colspan="5"></td>
                            <td class="text-right"><strong>${Seksi.subTotalNettProfitIDR}</strong></td>
                            <td></td>
                        </tr>
                    </template>
                    <!-- GRAND TOTAL CC NEW -->
                    <tr class="active" repeat.for="item of grandTotalByUomNew">

                        <td class="text-center" colspan="12" rowspan.bind="grandTotalByUomNew.length" if.bind="$index == 0"
                            style="background-color: #173250; color: #ffffff;">
                            <strong>T O T A L :</strong>
                        </td>
                        <td class="text-center"><strong>${item.uom}</strong></td>
                        <td class="text-right"><strong>${item.quantity | numberFormat:'0,000.00'}</strong></td>
                        <td colspan="7"></td>
                        <td class="text-right"><strong>${item.amount | numberFormat:'0,000.00'}</strong></td>
                        <td></td>
                        <td class="text-right"><strong>${item.amountIDR | numberFormat:'0,000.00'}</strong></td>
                        <td colspan="5"></td>
                        <td class="text-right"><strong>${item.grossProfitIDR | numberFormat:'0,000.00'}</strong></td>
                        <td></td>
                        <td class="text-right"><strong>${item.gpPremiIDR | numberFormat:'0,000.00'}</strong></td>
                        <td colspan="5"></td>
                        <td class="text-right"><strong>${item.nettProfitIDR | numberFormat:'0,000.00'}</strong></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <br>
        <div if.bind = "(old && old.length > 0) || (new && new.length > 0)">
            <table class="table table-bordered table-hover" id="myTable">
                <thead>
                    <tr>
                        <th class="text-center" colspan="5">GRAND TOTAL ALL</th>
                    </tr>
                    <tr>
                        <th class="text-center">UoM</th>
                        <th class="text-center">Quantity</th>
                        <th class="text-center">Amount USD</th>
                        <th class="text-center">Gross Profit IDR</th>
                        <th class="text-center">Nett Profit IDR</th>
                    </tr>
                </thead>

                <tbody>
                    <tr repeat.for="item of SubtotalAllByUOM">
                        <td class="text-center">${item.UOMUnit}</td>
                        <td class="text-right">${item.Quantity}</td>
                        <td class="text-right">${item.AmountUSD}</td>
                        <td class="text-right">${item.GrossProfitIDR}</td>
                        <td class="text-right">${item.NettProfitIDR}</td>
                    </tr>

                    <!-- GRAND TOTAL ALL: TANPA GROUPING UOM -->
                    <tr class="active">
                        <td class="text-center" style="background-color: #173250; color: #ffffff;" colspan="1"><strong>T O T A L :</strong></td>
                        <td class="text-right">${GrandTotalAll.Quantity}</td>
                        <td class="text-right">${GrandTotalAll.AmountUSD}</td>
                        <td class="text-right">${GrandTotalAll.GrossProfitIDR}</td>
                        <td class="text-right">${GrandTotalAll.NettProfitIDR}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="alert alert-info text-center" role="alert" if.bind="data.length == 0">
            Tidak Ada Data Yang Ditemukan.
        </div>
        <hr/>
    </form>

</template>
