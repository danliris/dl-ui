<template >
    <tr>
        <td>
            <au-checkbox 
                value.bind="data.IsSave"
                disabled.bind="readOnly"
                change.delegate="changeCheckBox()">
            </au-checkbox>
        </td>
        <td>
            <au-autocomplete
                value.bind="data.selectedPRItem"
                change.delegate="unitPRChanged($event)"
                error.bind="error.PRNo"
                read-only.bind="readOnly || isEdit"
                loader.bind="prLoader"
                text.bind="PRView"
                placeholder="Cari Purchase Request"
                view-model.ref="PRViewModel"
                options.bind="controlOptions">
            </au-autocomplete>
        </td>
        <td>
            <au-textbox value.bind="data.ProductName" read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-textbox value.bind="data.CategoryName" read-only.bind="true">
            </au-textbox>
        </td>
        <td>
            <au-numeric 
                value.bind="data.RemainingQuantity"
                read-only.bind="true">
            </au-numeric>
        </td>
        <td>
            <au-numeric 
                value.bind="data.Quantity"
                read-only.bind="context.context.options.readOnly"
                error.bind="error.Quantity">
            </au-numeric>
        </td>
        <td>
            <au-textbox 
                value.bind="data.Uom"
                read-only.bind="true" >
            </au-textbox>                    
        </td>
        <td>
            <au-textbox 
                value.bind="data.ProductRemark"
                read-only.bind="true" >
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.Line"
                error.bind="error.Line"
                read-only.bind="context.context.options.readOnly">
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.Area"
                error.bind="error.Area"
                read-only.bind="context.context.options.readOnly">
            </au-textbox>
        </td>
        <td>
            <au-textbox 
                value.bind="data.Section"
                error.bind="error.Section"
                read-only.bind="context.context.options.readOnly">
            </au-textbox>
        </td>
        <td class="bg-light" align="center">
            <div>
                <button class="btn btn-info btn-sm" click.delegate="toggle()">
                    <i class="fa" class.bind="isShowing ? 'i' : 'i'">i</i>
                </button>
                <button if.bind="!options.readOnly"
                    type="button"
                    class="btn btn-danger btn-sm"
                    click.delegate="removeItem()">-
                </button>
            </div>
        </td>
        <!-- <td if.bind="!options.readOnly">
            <button type="button" class="btn btn-danger" click.delegate="context.context.options.remove && context.context.options.remove(data)">-</button>
        </td> -->
    </tr>
    <tr show.bind="isShowing">
        <td colspan="15" style="border:none; padding-left: 100px; padding-right: 130px; padding-bottom: 20px;">
            <table class="table table-bordered" style="margin:0;">
                <thead>
                    <tr>
                        <th style="width:9.1%;">Inventory Number</th>
                        <th style="width:9.1%;">Machine Type</th>
                        <th style="width:8.1%;">Brand</th>
                        <th style="width:8.1%;">Model</th>
                        <th style="width:8.1%;">Serial Number</th>
                        <th style="width:8.1%;">Part Number</th>
                        <th style="width:8.1%;">Item Part</th>
                        <th style="width:8.1%;">Repair Description</th>
                        <th style="width:8.1%;">Repair Result</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <au-textbox
                                value.bind="data.InventoryNumber"
                                error.bind="error.InventoryNumber"
                                read-only.bind="context.context.options.readOnly">
                            </au-textbox>
                        </td>
                        <td>
                            <au-textbox
                                value.bind="data.MachineType"
                                error.bind="error.MachineType"
                                read-only.bind="context.context.options.readOnly">
                            </au-textbox>
                        </td>
                        <td>
                            <au-textbox
                                value.bind="data.Brand"
                                error.bind="error.Brand"
                                read-only.bind="context.context.options.readOnly">
                            </au-textbox>
                        </td>
                        <td>
                            <au-textbox
                                value.bind="data.Model"
                                error.bind="error.Model"
                                read-only.bind="context.context.options.readOnly">
                            </au-textbox>
                        </td>
                        <td>
                            <au-textbox
                                value.bind="data.SerialNumber"
                                error.bind="error.SerialNumber"
                                read-only.bind="context.context.options.readOnly">
                            </au-textbox>
                        </td>
                        <td>
                            <au-textbox
                                value.bind="data.PartNumber"
                                error.bind="error.PartNumber"
                                read-only.bind="context.context.options.readOnly">
                            </au-textbox>
                        </td>
                        <td>
                            <au-textbox
                                value.bind="data.ItemPart"
                                error.bind="error.ItemPart"
                                read-only.bind="context.context.options.readOnly">
                            </au-textbox>
                        </td>
                        <td>
                            <au-textbox
                                value.bind="data.RepairDescription"
                                error.bind="error.RepairDescription"
                                read-only.bind="context.context.options.readOnly">
                            </au-textbox>
                        </td>
                        <td>
                            <au-textbox
                                value.bind="data.RepairResult"
                                error.bind="error.RepairResult"
                                read-only.bind="context.context.options.readOnly">
                            </au-textbox>
                        </td>
                    </tr>
                </tbody>
            </table>
        </td>
    </tr>
        
</template>
